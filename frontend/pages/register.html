<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
     <link rel="stylesheet" href="../css/style.css">
     <title>Apoie.me</title>
</head>

<body class="register-page" >

     <div class="container-form">

          <div class="text-form">
               <div class="logo">
                    <img src="../assets/logo2.png" alt="Logo Apoie.me">
               </div>
               <h1>Criar Conta</h1>
               <p>Faça seu cadastro na Apoie.me</p>
          </div>

          <form id="formCadastro">

               <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
               </div>

               <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
               </div>

               <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
               </div>

               <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    <div id="requisitos-senha" class="senha-requisitos">

                         <p id="req-maiuscula">✗ Pelo menos uma letra maiúscula</p>

                         <p id="req-minuscula">✗ Pelo menos uma letra minúscula</p>

                         <p id="req-numero">✗ Pelo menos um número</p>

                         <p id="req-especial">✗ Pelo menos um caractere especial</p>

                         <p id="req-tamanho">✗ Pelo menos 6 caracteres</p>

                    </div>
               </div>

               <div class="input-group">
                    <label for="confirmarSenha">Confirmar senha *</label>
                    <input type="password" id="confirmarSenha" placeholder="Digite novamente sua senha" required>
                    <small id="mensagem-confirmacao"></small>
               </div>
               <button type="submit">Cadastrar</button>

          </form>

          <a class="register-link" href="../pages/login.html">Já tenho conta</a>

     </div>

     <script src="../js/register.js"></script>
</body>
</html>
