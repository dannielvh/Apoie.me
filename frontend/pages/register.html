<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
     <link rel="stylesheet" href="../css/style.css">
     <title>Cadastro</title>
</head>

<body class="register-page" style="display:flex; justify-content:center; align-items:center; min-height:100vh; background-color:#F5F5DC;">

     <div class="container-form">

          <div class="text-form">
               <i class="fa-solid fa-heart"></i>
               <h1>Criar Conta</h1>
               <p>Faça seu cadastro na Rede Solidária</p>
          </div>

          <form action="/register" method="POST">

               <div class="input-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" placeholder="Seu nome completo" required>
               </div>

               <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
               </div>

               <div class="input-group">
                    <label for="city">Cidade</label>
                    <input type="text" id="city" name="city" placeholder="Sua cidade" required>
               </div>

               <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
               </div>

               <button type="submit">Cadastrar</button>

          </form>

          <a class="register-link" href="../pages/login.html">Já tenho conta</a>

     </div>

</body>
</html>
