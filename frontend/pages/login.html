<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
     <link rel="stylesheet" href="../css/style.css">
     <title>Apoie.me</title>
</head>
<body class="login-page" >
     <div class="container-form">
          <div class="text-form">
               <div class="logo">
                    <img src="../assets/logo2.png" alt="Logo Apoie.me">
               </div>
               <h1>Apoie.me</h1>
               <p>Conectando comunidades em momentos de emergência</p>
          </div>
          <form id="formLogin">
               <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com">
               </div>
               <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="suasenha" required>
               </div>
               <button type="submit">Entrar</button>
          </form>
          <a class="register-link" href="../pages/register.html">Criar Conta</a>
     </div>

     <script src="../js/login.js"></script>
</body>
</html>
