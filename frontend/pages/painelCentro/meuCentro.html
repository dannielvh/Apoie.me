<!DOCTYPE html>
<html lang="pt-br">

<head>
     <meta charset="UTF-8">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/regular.min.css" />
     <link rel="stylesheet" href="../../css/style.css">
     <title>Meu Centro | Apoie.me</title>

</head>

<body class="meu-centro-page">
     <div id="header"></div>

     <main class="meu-centro">
    <section class="meu-centro__header">
      <div>
        <h1>Meu Centro</h1>
        <p>Edite as informações básicas do seu centro de apoio.</p>
      </div>

      <a href="../painelCentro/dashboardCentro.html">Voltar ao painel</a>
    </section>

    <section class="meu-centro__card">
      <form id="formMeuCentro">

        <div class="form-group">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" >
        </div>

        <div class="form-group">
          <label for="cidade-input">Cidade *</label>

          <div class="cidade__select-wrapper">
            <input type="text" id="cidade-input" autocomplete="off" >
            <ul id="sugestoes" class="sugestoes-lista"></ul>
          </div>
        </div>

        <div class="form-group">
          <label for="tipo">Tipo *</label>
          <select id="tipo" >
            <option value="">Selecione o tipo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="rua">Endereço *</label>
          <input type="text" id="rua" >
        </div>

        <div class="form-group">
          <label for="horario">Horário</label>
          <input type="text" id="horario">
        </div>

        <div class="form-group">
          <label for="telefone">Telefone *</label>
          <input type="text" id="telefone" >
        </div>

        <div class="form-group">
          <label for="email_contato">Email de contato</label>
          <input type="email" id="email_contato">
        </div>

        <div class="form-group">
          <label for="responsavel_nome">Responsável *</label>
          <input type="text" id="responsavel_nome" >
        </div>

        <div class="form-group">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj">
        </div>

        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao"></textarea>
        </div>

        <button type="submit">Salvar alterações</button>
      </form>

      <p id="msg"></p>
    </section>
  </main>

     <script src="../../js/components/headerCentro.js"></script>
     <script src="../../js/painelCentro/meuCentro.js"></script>
</body>

</html>
